name: Update Flake Inputs
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [flake.lock]
concurrency:
  group: update-flake-inputs
  cancel-in-progress: true
jobs:
  update-flake-inputs:
    runs-on: nix
    steps:
      - uses: mirrors/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_BOT_TOKEN }}
      - name: The forge over ci-bot's token, then endo's one updater (update-inputs, endo docs/shipping.md)
        env:
          GITEA_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          forge="${GITHUB_SERVER_URL%%://*}://ci-bot:${GITEA_TOKEN}@${GITHUB_SERVER_URL#*://}"
          for src in ssh://forgejo@forge/ $(grep -ohE 'ssh://forgejo@[^/"[:space:]]+/' flake.nix flake.lock | sort -u); do git config --global --add url."${forge%/}/".insteadOf "$src"; done
          nix --extra-experimental-features 'nix-command flakes' run 'git+ssh://forgejo@forge/eklipsetech/endo.git?ref=main#update-inputs' --
